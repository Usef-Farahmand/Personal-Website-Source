# Records each project's public store numbers once a day, building the
# history behind the growth charts on project pages
# (src/content/generated/store-history.json). Commits only when a number
# changed, so a quiet day causes no deploy.
name: Store stats snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --no-warnings scripts/snapshot-store-stats.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/content/generated/store-history.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/content/generated/store-history.json
          git commit -m "chore(stats): daily store snapshot"
          git push
