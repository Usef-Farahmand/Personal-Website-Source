<!--
  EmailJS template: "Contact — notification" (message to the site owner)
  Settings in the EmailJS dashboard:
    Subject:     New message: {{subject}} — from {{name}}
    To Email:    contact@useffarahmand.com   (fixed — never a variable)
    From Name:   useffarahmand.com
    Reply To:    {{email}}
  Paste everything below this comment into the template's code editor.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>New contact message</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f5">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f5"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
              border-radius: 12px;
              overflow: hidden;
              font-family:
                &quot;Segoe UI&quot;, Tahoma, Helvetica, Arial, sans-serif;
            "
          >
            <tr>
              <td
                style="
                  background-color: #0a0a0b;
                  padding: 20px 28px;
                  border-bottom: 3px solid #f97316;
                "
              >
                <span
                  style="
                    font-size: 13px;
                    letter-spacing: 1px;
                    text-transform: uppercase;
                    color: #f97316;
                    font-weight: 700;
                  "
                  >useffarahmand.com</span
                >
                <div
                  style="
                    font-size: 20px;
                    line-height: 28px;
                    color: #f5f5f4;
                    font-weight: 700;
                    margin-top: 4px;
                  "
                >
                  New message from the contact form
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 28px 8px 28px">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="font-size: 14px; line-height: 22px; color: #18181b"
                >
                  <tr>
                    <td
                      width="90"
                      style="
                        padding: 6px 0;
                        color: #71717a;
                        vertical-align: top;
                      "
                    >
                      Name
                    </td>
                    <td dir="auto" style="padding: 6px 0; font-weight: 600">
                      {{name}}
                    </td>
                  </tr>
                  <tr>
                    <td
                      width="90"
                      style="
                        padding: 6px 0;
                        color: #71717a;
                        vertical-align: top;
                      "
                    >
                      Email
                    </td>
                    <td style="padding: 6px 0">
                      <a
                        href="mailto:{{email}}"
                        style="
                          color: #ea580c;
                          text-decoration: none;
                          font-weight: 600;
                        "
                        >{{email}}</a
                      >
                    </td>
                  </tr>
                  <tr>
                    <td
                      width="90"
                      style="
                        padding: 6px 0;
                        color: #71717a;
                        vertical-align: top;
                      "
                    >
                      Subject
                    </td>
                    <td dir="auto" style="padding: 6px 0">{{subject}}</td>
                  </tr>
                  <tr>
                    <td
                      width="90"
                      style="
                        padding: 6px 0;
                        color: #71717a;
                        vertical-align: top;
                      "
                    >
                      Language
                    </td>
                    <td style="padding: 6px 0">{{locale}}</td>
                  </tr>
                  <tr>
                    <td
                      width="90"
                      style="
                        padding: 6px 0;
                        color: #71717a;
                        vertical-align: top;
                      "
                    >
                      Sent
                    </td>
                    <td style="padding: 6px 0">{{time}} (Tehran)</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 28px 24px 28px">
                <div
                  style="font-size: 13px; color: #71717a; margin-bottom: 8px"
                >
                  Message
                </div>
                <div
                  dir="auto"
                  style="
                    background-color: #fafafa;
                    border: 1px solid #e4e4e7;
                    border-left: 4px solid #f97316;
                    border-radius: 8px;
                    padding: 16px;
                    font-size: 15px;
                    line-height: 24px;
                    color: #18181b;
                    white-space: pre-wrap;
                    word-break: break-word;
                  "
                >{{message}}</div>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 28px 28px 28px">
                <a
                  href="mailto:{{email}}"
                  style="
                    display: inline-block;
                    background-color: #f97316;
                    color: #ffffff;
                    font-size: 14px;
                    font-weight: 700;
                    text-decoration: none;
                    padding: 12px 22px;
                    border-radius: 8px;
                  "
                  >Reply to {{name}}</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 28px;
                  background-color: #fafafa;
                  border-top: 1px solid #e4e4e7;
                  font-size: 12px;
                  line-height: 18px;
                  color: #a1a1aa;
                "
              >
                Sent from
                <a href="{{page_url}}" style="color: #a1a1aa">{{page_url}}</a>.
                Replying to this email goes straight to the sender.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
